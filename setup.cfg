[metadata]
name = ecu-rogue
version = 1.0.0
author = Game Development Team
author_email = your.email@example.com
description = A modular Python roguelike game exploring automotive ECU systems
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourusername/OBDIIGame
project_urls =
    Bug Tracker = https://github.com/yourusername/OBDIIGame/issues
    Documentation = https://github.com/yourusername/OBDIIGame/tree/main/docs
    Source Code = https://github.com/yourusername/OBDIIGame
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Education
    Intended Audience :: Developers
    Topic :: Games/Entertainment :: Role-Playing
    Topic :: Education
    Topic :: Software Development :: Libraries :: Python Modules
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pytest>=7.4.0

[options.packages.find]
exclude =
    tests
    tests.*
    docs
    docs.*

[options.package_data]
* =
    config/**/*.json
    assets/**/*.txt
    assets/**/*.md

[options.entry_points]
console_scripts =
    ecu-rogue = main:main

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    mypy>=1.5.0
    black>=23.0.0
    flake8>=6.0.0

[flake8]
max-line-length = 100
extend-ignore = E203, E266, E501, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    venv,
    env

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers

[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
